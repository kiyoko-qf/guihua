<style>
  :root {
    --paper: #F7F0DF;
    --ink: #2E2A24;
    --soft: #7A6E5F;
    --gold: #B0802C;
    --gold-l: #DFC08A;
    --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, "Songti", serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-family: var(--serif);
    background:
      radial-gradient(900px 620px at 50% -6%, #F5E3BB 0%, rgba(245, 227, 187, 0) 62%),
      radial-gradient(900px 560px at 12% 108%, #EADCC0 0%, rgba(234, 220, 192, 0) 58%),
      var(--paper);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .petal {
    position: absolute; top: -5vh; width: 8px; height: 8px;
    background: radial-gradient(circle at 30% 30%, #F2D79B, #D9AE5C);
    border-radius: 60% 40% 55% 45%; opacity: .5;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translate3d(0, -8vh, 0) rotate(0deg); }
    100% { transform: translate3d(38px, 106vh, 0) rotate(260deg); }
  }
  .stage {
    position: relative; z-index: 1;
    width: min(980px, 92vw);
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 56px;
    align-items: center;
    padding: 8vh 0 6vh;
  }
  .poster {
    display: block;
    width: min(360px, 34vw);
    aspect-ratio: 1 / 1;
    border-radius: 4px;
    border: 1px solid rgba(176, 128, 44, .28);
    box-shadow: 0 24px 60px rgba(80, 60, 30, .18);
  }
  .copy { text-align: left; }
  .kicker {
    font-family: var(--sans); font-size: 12px; letter-spacing: .36em;
    color: var(--gold); margin: 0 0 18px;
  }
  h1 {
    font-size: clamp(28px, 3.6vw, 42px);
    line-height: 1.42; letter-spacing: .05em; font-weight: 600; margin: 0;
  }
  .lede {
    margin: 20px 0 0; max-width: 26em;
    font-size: 15px; line-height: 2; color: #4A4238;
  }
  .meta {
    list-style: none; padding: 0; margin: 20px 0 0;
    display: flex; flex-wrap: wrap; gap: 6px 0;
    font-family: var(--sans); font-size: 12px; letter-spacing: .1em; color: var(--soft);
  }
  .meta li + li::before { content: "·"; margin: 0 10px; color: var(--gold-l); }
  .cta {
    display: inline-block; margin-top: 32px;
    padding: 14px 42px;
    background: var(--ink); color: #FBF4E2;
    text-decoration: none;
    font-family: var(--sans); font-size: 14px; letter-spacing: .22em;
    border-radius: 2px;
    transition: background .2s ease, transform .2s ease;
  }
  .cta:hover { background: #443C31; }
  .cta:active { transform: translateY(1px); }
  .note { margin: 16px 0 0; font-family: var(--sans); font-size: 11.5px; letter-spacing: .06em; color: #A2937C; }
  .foot {
    position: relative; z-index: 1;
    padding: 0 0 24px;
    font-family: var(--sans); font-size: 11px; letter-spacing: .08em; color: #A2937C;
    text-align: center;
  }
  .foot a { color: #A2937C; }
  @media (prefers-reduced-motion: reduce) { .petals { display: none; } }
  @media (max-width: 820px) {
    .stage {
      grid-template-columns: 1fr;
      justify-items: center;
      text-align: center;
      gap: 30px;
      padding: 6vh 0 4vh;
    }
    .poster { width: min(300px, 64vw); }
    .copy { text-align: center; }
    .lede { margin-left: auto; margin-right: auto; font-size: 14.5px; }
    .meta { justify-content: center; }
    .cta { padding: 13px 36px; }
  }
  @media (max-width: 380px) {
    .poster { width: 62vw; }
    h1 { font-size: 24px; }
  }
</style>
</head>

    <i class="petal" style="left:93%;animation-duration:18s;animation-delay:-7s;opacity:.35"></i>
  </div>

  <main class="stage">
    <img class="poster" src="cover-1x1.png" width="360" height="360"
         alt="《桂花糕、旧车票和一只打翻的盘子》封面：暖色纸面、月亮与桂花枝">

    <div class="copy">
      <p class="kicker">中秋夜 · 一个家庭的小谜题</p>

    </div>
